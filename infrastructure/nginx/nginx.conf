user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Disable nginx version disclosure
    server_tokens off;

    # MIME types and defaults
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging — minimal, no full URI capture for privacy
    log_format minimal '$remote_addr - [$time_local] "$request_method $uri" '
                       '$status $body_bytes_sent "$http_referer"';
    access_log /var/log/nginx/access.log minimal;

    sendfile on;
    keepalive_timeout 30s;
    client_max_body_size 64k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 30s;

    # Upstreams
    upstream frontend { server frontend:3000; }
    upstream backend  { server backend:8000; }

    # Rate limiting — separate zones for API vs general traffic
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=general:10m rate=120r/m;
    limit_req_zone $binary_remote_addr zone=auth_strict:10m rate=10r/m;    # login / register
    limit_req_zone $binary_remote_addr zone=auth_verify:10m rate=6r/m;     # TOTP-Codes
    limit_req_zone $binary_remote_addr zone=voice_upload:10m rate=15r/m;   # Audio-Uploads
    limit_conn_zone $binary_remote_addr zone=conn:10m;

    # Hide common probe paths and reject obvious junk
    map $http_user_agent $bad_bot {
        default 0;
        ~*(nikto|sqlmap|fimap|nessus|wpscan|masscan|nmap|dirbuster|acunetix|nuclei|zgrab|httpx|ffuf|gobuster|wfuzz|sqlninja|hydra|medusa|burp|zap) 1;
    }

    # Blockiere offensichtliche Exploit-Payloads in URIs
    map $request_uri $bad_uri {
        default 0;
        "~*(\.\./|\\.\\.\\\\|%2e%2e%2f|%00|<script|onerror=|eval\(|base64_|/etc/passwd|/proc/self|%%ECHO)" 1;
    }

    # Log Format mit mehr Kontext für Security-Triage (status, UA, ref)
    log_format security '$remote_addr - [$time_local] "$request_method $uri" '
                        '$status $body_bytes_sent "$http_referer" "$http_user_agent" rt=$request_time';
    access_log /dev/stdout minimal;
    access_log /dev/stdout security if=$bad_uri;

    server {
        listen 80;
        server_name _;

        # Block known bad bots
        if ($bad_bot) { return 444; }
        # Block obvious exploit payloads in URI
        if ($bad_uri)  { return 444; }

        # Block clearly malicious paths early
        location ~* \.(php|asp|aspx|jsp|cgi)$            { return 444; }
        location ~* /\.(git|env|svn|htaccess|htpasswd)    { return 444; }
        location ~* /(wp-admin|wp-login|xmlrpc|phpmyadmin) { return 444; }

        # Connection limits
        limit_conn conn 20;

        # Security headers (apply to ALL responses)
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(self), microphone=(self), camera=(), payment=(), usb=(), fullscreen=(self), autoplay=(self)" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://unpkg.com; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://tile.openstreetmap.de https://*.basemaps.cartocdn.com https://*.cartocdn.com; media-src 'self' blob: data:; font-src 'self' data:; connect-src 'self' blob:; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;

        # Gzip
        gzip on;
        gzip_vary on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
        gzip_min_length 1000;

        # Block trace methods
        if ($request_method !~ ^(GET|HEAD|POST|OPTIONS)$) {
            return 444;
        }

        # Voice endpoints: audio uploads bis 8 MB + längere Timeouts für STT/TTS
        location /api/voice/ {
            limit_req zone=voice_upload burst=3 nodelay;
            client_max_body_size 8m;
            client_body_timeout 30s;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 180s;
            proxy_request_buffering on;
            proxy_hide_header X-Powered-By;
        }

        # Login / Register / Reset — strengstes Limit + kein Burst
        location ~ ^/api/auth/(login|register|resend-verification|verify-email|password)$ {
            limit_req zone=auth_strict burst=3 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
            proxy_hide_header X-Powered-By;
        }

        # TOTP-Verify — härtestes Limit, kein Burst
        location = /api/auth/login/verify {
            limit_req zone=auth_verify burst=2 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
            proxy_hide_header X-Powered-By;
        }

        # API routes -> Backend (stricter rate limit)
        location /api/ {
            limit_req zone=api burst=10 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_hide_header X-Powered-By;
        }

        # Health check -> Backend (no rate limit, no logging)
        location = /health {
            access_log off;
            proxy_pass http://backend/health;
            proxy_set_header Host $host;
        }

        # Block source maps in production
        location ~* \.map$ { return 404; }

        # Everything else -> Frontend
        location / {
            limit_req zone=general burst=30 nodelay;
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_hide_header X-Powered-By;
        }
    }
}
