services:

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=
      - NODE_ENV=production
    depends_on:
      - backend
    networks:
      - transit-network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64M,mode=1777
      - /app/.next/cache:size=128M
    pids_limit: 200
    mem_limit: 512m
    cpus: 1.0
    user: "1001:1001"

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
      db-rest:
        condition: service_started
    volumes:
      - ../llm:/project/llm:ro
      # mTLS-Zertifikate (optional, nur falls DB-API Timetables genutzt wird).
      # Für Public-Repo nicht enthalten — siehe DEPLOYMENT.md §3.5
      - ../secrets/transit-ai-cert.pem:/run/secrets/transit-ai-cert.pem:ro
      - ../secrets/transit-ai-key.pem:/run/secrets/transit-ai-key.pem:ro
      # Voice-Modelle (optional). Pfad relativ zum Projekt anpassen.
      - ../../transit-ai-data/models:/models:ro
    networks:
      - transit-network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64M,mode=1777
    pids_limit: 200
    mem_limit: 1g
    cpus: 2.0
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  db-rest:
    image: derhuerst/db-rest:6
    restart: unless-stopped
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
    networks:
      - transit-network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64M
    pids_limit: 200
    mem_limit: 768m
    cpus: 1.5
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
      --protected-mode yes
      --requirepass "${REDIS_PASSWORD:-}"
    volumes:
      - redis_data:/data
    networks:
      - transit-network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    pids_limit: 200
    mem_limit: 2560m
    cpus: 1.0
    user: "999:999"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-transitai}
      POSTGRES_USER: ${POSTGRES_USER:-transitai_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_HOST_AUTH_METHOD: "scram-sha-256"
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    command: >
      postgres
      -c hba_file=/etc/postgresql/pg_hba.conf
      -c password_encryption=scram-sha-256
      -c log_connections=on
      -c log_disconnections=on
      -c log_statement=ddl
      -c log_min_duration_statement=2000
      -c statement_timeout=30s
      -c idle_in_transaction_session_timeout=60s
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-01-security.sql:/docker-entrypoint-initdb.d/01-security.sql:ro
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    networks:
      - transit-network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
      - FOWNER
    pids_limit: 200
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-transitai_app} -d ${POSTGRES_DB:-transitai}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - transit-network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
      - DAC_OVERRIDE
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=64M
      - /var/run:size=8M
      - /tmp:size=32M
    pids_limit: 200
    mem_limit: 256m
    cpus: 0.5

volumes:
  redis_data:
  postgres_data:

networks:
  transit-network:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_icc: "true"
      com.docker.network.bridge.enable_ip_masquerade: "true"
